---
- name: Download Brave Browser GPG Key
  ansible.builtin.get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    mode: '0644'

- name: Add Brave Browser Repository
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/brave-browser-release.list
    line: "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
    create: yes

- name: Update APT Cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install Brave Browser
  ansible.builtin.apt:
    name: brave-browser
    state: present
- name: Set Brave as the default browser
  command: xdg-settings set default-web-browser brave-browser.desktop
  register: result
