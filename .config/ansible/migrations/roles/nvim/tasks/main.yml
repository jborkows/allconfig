---
- name: Download Neovim release {{ nvimversion }}
  ansible.builtin.get_url:
    url: https://github.com/neovim/neovim/releases/download/v{{nvimversion}}/nvim-linux-x86_64.tar.gz
    dest: /tmp/nvim-linux64.tar.gz
    mode: '0644'

- name: Remove existing Neovim installation
  ansible.builtin.file:
    path: /opt/nvim-linux64
    state: absent

- name: Extract Neovim to /opt
  ansible.builtin.unarchive:
    src: /tmp/nvim-linux64.tar.gz
    dest: /opt
    remote_src: yes
- name: Rename archive directory
  ansible.builtin.command: mv /opt/nvim-linux-x86_64 /opt/nvim-linux64

