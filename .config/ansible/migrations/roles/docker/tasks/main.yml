---
- name: Update apt package index
  apt:
    update_cache: yes

- name: Install required packages for Docker
  apt:
    name: 
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    state: present

- name: Add Docker’s official GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Update apt package index after adding Docker repo
  apt:
    update_cache: yes

- name: Install Docker
  apt:
    name: docker-ce
    state: present

- name: Check if docker_data_dir is set
  fail:
    msg: "You must provide a value for docker_data_dir"
  when: docker_data_dir is not defined

- name: Install Docker Compose
  apt:
    name: docker-compose
    state: present

- name: Ensure Docker is stopped before configuring custom folder
  systemd:
    name: docker
    state: stopped

- name: Create custom Docker data directory
  file:
    path: "{{ docker_data_dir }}"
    state: directory
    mode: '0755'

- name: Configure Docker to use custom data directory
  copy:
    content: |
      {
        "data-root": "{{ docker_data_dir }}"
      }
    dest: /etc/docker/daemon.json

- name: Start Docker with new configuration
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add user to docker group (optional)
  user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: yes

