---
- name: Run tasks on localhostpla
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Print a message
      ansible.builtin.debug:
        msg: "Hello, localhost!"
- name: Fetch hostname
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Print hostname
      ansible.builtin.debug:
        var: ansible_hostname
- name: Ask for sudo
  hosts: localhost
  become: true
  become_method: ansible.builtin.sudo
  vars_prompt:
    - name: ansible_become_password
      prompt: "Enter your password for sudo:"
      private: true
- name: Update
  hosts: localhost
  become: true
  roles:
    - kubectl

- name: Zoxide
  hosts: localhost
  roles:
    - role: zoxide  
      tags:
        - zoxide
- name: gh
  hosts: localhost
  roles:
    - role: gh
      tags:
        - gh
        - github
- name: Applications
  hosts: localhost
  roles:
    - role: yazi
      tags:
        - yazi
    - role: glow
      tags:
        - glow
- name: Properties
  hosts: localhost
  become: false
  roles:
    - upgradeproperties

- name: Bash customization
  hosts: localhost
  roles:
    - bashcustomization
  tags:
    - bash

- name: Docker
  hosts: localhost
  become: true
  roles:
    - role: docker  
      tags:
        - docker

- name: Carapace
  hosts: localhost
  become: true
  roles:
    - role: carapace
      tags:
        - carapace

- name: kanata
  hosts: localhost
  become: false
  roles:
    - role: kanata
      tags:
        - kanata
  
- name: ufw
  hosts: localhost
  become: true
  roles:
    - role: ufw
      tags:
        - ufw
